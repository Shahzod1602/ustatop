services:
  postgres:
    image: postgres:16-alpine
    container_name: ustatop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ustatop_postgres_data:/var/lib/postgresql/data
    networks: [ustatop]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: ustatanla-app:latest
    container_name: ustatop-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && npm run start"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    networks: [ustatop]

  bot:
    image: ustatanla-app:latest
    container_name: ustatop-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
    command: sh -c "npm run bot"
    volumes:
      - ./bot:/app/bot
    networks: [ustatop]

networks:
  ustatop:

volumes:
  ustatop_postgres_data:
